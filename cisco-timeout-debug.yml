- name: Teste E - tentar reproduzir SSH channel failure no IOS XR
  hosts: all
  gather_facts: no

  pre_tasks:
    - name: Mostrar env vars relevantes no controller
      ansible.builtin.debug:
        msg:
          - "ENV ANSIBLE_TIMEOUT={{ lookup('ansible.builtin.env', 'ANSIBLE_TIMEOUT', default='__UNDEF__') }}"
          - "ENV ANSIBLE_PERSISTENT_COMMAND_TIMEOUT={{ lookup('ansible.builtin.env', 'ANSIBLE_PERSISTENT_COMMAND_TIMEOUT', default='__UNDEF__') }}"
          - "ENV ANSIBLE_PERSISTENT_CONNECT_TIMEOUT={{ lookup('ansible.builtin.env', 'ANSIBLE_PERSISTENT_CONNECT_TIMEOUT', default='__UNDEF__') }}"
          - "ENV ANSIBLE_PERSISTENT_LOG_MESSAGES={{ lookup('ansible.builtin.env', 'ANSIBLE_PERSISTENT_LOG_MESSAGES', default='__UNDEF__') }}"
      delegate_to: localhost
      run_once: true

    - name: Mostrar vars efetivas do host
      ansible.builtin.debug:
        msg:
          - "ansible_connection={{ ansible_connection | default('__UNDEF__') }}"
          - "ansible_network_os={{ ansible_network_os | default('__UNDEF__') }}"
          - "ansible_network_cli_ssh_type={{ ansible_network_cli_ssh_type | default('__UNDEF__') }}"

    - name: Abrir a sessao persistente
      cisco.iosxr.iosxr_command:
        commands:
          - show version
      register: open_session

    - name: Mostrar horario inicial
      ansible.builtin.debug:
        msg: "Sessao aberta com sucesso. UTC={{ now(utc=true) }}"

    - name: Janela curta para preparar a quebra
      ansible.builtin.pause:
        seconds: 20

    - name: Aviso final antes do comando longo
      ansible.builtin.debug:
        msg:
          - "O proximo passo vai executar um comando longo."
          - "ASSIM QUE a task 'Executar comando longo' ficar em RUNNING no AAP, espere 5 a 10 segundos e provoque a quebra abrupta."
          - "Metodo preferido: remover/desconectar o cabo entre o XRv management e o Cloud no GNS3."
          - "Metodo alternativo: desligar o node XRv no GNS3."
          - "Nao use 'shutdown' da interface neste teste, porque isso tende a virar command timeout e nao channel failure."

  tasks:
    - block:
        - name: Executar comando longo
          cisco.iosxr.iosxr_command:
            commands:
              - "ping 203.0.113.1 count 1000 timeout 2"
          register: long_cmd

        - name: Mostrar saida do comando longo se ele terminar
          ansible.builtin.debug:
            var: long_cmd

        - name: Tentar facts apos o comando longo
          cisco.iosxr.iosxr_facts:
          register: facts_after_long_cmd

        - name: Mostrar facts apos o comando longo
          ansible.builtin.debug:
            var: facts_after_long_cmd

      rescue:
        - name: Mostrar falha capturada do comando longo
          ansible.builtin.debug:
            var: ansible_failed_result

        - name: Tentar facts apos a falha
          cisco.iosxr.iosxr_facts:
          register: facts_after_failure
          ignore_errors: true

        - name: Mostrar resultado do facts apos a falha
          ansible.builtin.debug:
            var: facts_after_failure

        - name: Mostrar horario final da falha
          ansible.builtin.debug:
            msg: "Falha capturada. UTC={{ now(utc=true) }}"
