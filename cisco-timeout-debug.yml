- name: Teste de quebra real de conectividade IOS XR
  hosts: all
  gather_facts: no

  pre_tasks:
    - name: Mostrar env vars relevantes no controller
      ansible.builtin.debug:
        msg:
          - "ENV ANSIBLE_TIMEOUT={{ lookup('ansible.builtin.env', 'ANSIBLE_TIMEOUT', default='__UNDEF__') }}"
          - "ENV ANSIBLE_PERSISTENT_COMMAND_TIMEOUT={{ lookup('ansible.builtin.env', 'ANSIBLE_PERSISTENT_COMMAND_TIMEOUT', default='__UNDEF__') }}"
          - "ENV ANSIBLE_PERSISTENT_CONNECT_TIMEOUT={{ lookup('ansible.builtin.env', 'ANSIBLE_PERSISTENT_CONNECT_TIMEOUT', default='__UNDEF__') }}"
          - "ENV ANSIBLE_PERSISTENT_LOG_MESSAGES={{ lookup('ansible.builtin.env', 'ANSIBLE_PERSISTENT_LOG_MESSAGES', default='__UNDEF__') }}"
      delegate_to: localhost
      run_once: true

    - name: Mostrar vars efetivas do host
      ansible.builtin.debug:
        msg:
          - "ansible_connection={{ ansible_connection | default('__UNDEF__') }}"
          - "ansible_network_os={{ ansible_network_os | default('__UNDEF__') }}"
          - "ansible_command_timeout={{ ansible_command_timeout | default('__UNDEF__') }}"
          - "ansible_connect_timeout={{ ansible_connect_timeout | default('__UNDEF__') }}"
          - "ansible_network_cli_ssh_type={{ ansible_network_cli_ssh_type | default('__UNDEF__') }}"

  tasks:
    - name: Abrir a sessao persistente
      cisco.iosxr.iosxr_command:
        commands:
          - show version

    - name: Aviso sobre a acao manual
      ansible.builtin.debug:
        msg:
          - "Agora derrube a conectividade de management do XRv e deixe-a derrubada."
          - "Metodo recomendado: pelo console do XR, faça shutdown da MgmtEth0/RP0/CPU0/0."
          - "Nao religue a interface ate o playbook terminar."

    - name: Janela para derrubar a conectividade
      ansible.builtin.pause:
        seconds: 90

    - block:
        - name: Teste simples apos a quebra
          cisco.iosxr.iosxr_command:
            commands:
              - show clock
          vars:
            ansible_command_timeout: 30
            ansible_connect_timeout: 30
          register: second_cmd

        - name: Coletar facts apos a quebra
          cisco.iosxr.iosxr_facts:
          vars:
            ansible_command_timeout: 30
            ansible_connect_timeout: 30
          register: facts_out

        - name: Mostrar resultado resumido
          ansible.builtin.debug:
            msg:
              - "second_cmd_ok={{ second_cmd is succeeded }}"
              - "facts_ok={{ facts_out is succeeded }}"

      rescue:
        - name: Mostrar falha capturada
          ansible.builtin.debug:
            var: ansible_failed_result
